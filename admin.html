<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PANEL - Global Savings</title>
<link rel="stylesheet" href="admin.css">
</head><body>
<h2 style="margin:4px 0">🔐 ADMIN - admin@gmail.com</h2>
<div style="font-size:11px;color:#8aa0c2;margin-bottom:12px">Control: Disable / Pause / Delete | WhatsApp: +2349134538841</div>
<div id="loginBox" class="card"><h3>Admin Login</h3>
<input id="email" value="admin@gmail.com">

<button class="btn btnB" onclick="login()">Login</button>
<div id="loginMsg" style="color:#f87171;font-size:12px;margin-top:8px"></div>
</div>
<div id="adminBox" style="display:none">

<div class="tab" id="tabTrade" onclick="showTab('trades')">Trades</div>
<div class="tab" id="tabUsers" onclick="showTab('users')">Users</div>

<div class="tab" id="tabTier" onclick="showTab('tierVerifications')">Tier</div>

</div>
<h3 id="title">Deposits</h3>
<div id="list">Loading...</div>

</div>
<script type="module" src="admin.js"></script>
