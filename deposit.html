<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit</title>
<style>body{margin:0;background:#eef4ff;font-family:Arial;padding-bottom:90px}.header{padding:16px;background:white;display:flex;justify-content:space-between}.card{margin:16px;background:white;border-radius:18px;padding:20px}input{width:100%;padding:12px;border:1px solid #cbd7ea;border-radius:9px;margin-top:10px}button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:12px;cursor:pointer}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #e2e8f0}.bottomNav a{text-decoration:none;color:#64748b;font-size:11px;text-align:center;display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="header"><b onclick="history.back()" style="cursor:pointer">← Back</b><b>Deposit</b><span></span></div>
<div class="card"><h3>Make a Deposit</h3><p style="color:#64748b;font-size:13px">Minimum $10. Contact support after payment.</p><input id="amount" type="number" placeholder="Enter amount USD"><button onclick="submit()">Submit Deposit Request</button><div id="msg" style="font-size:13px;margin-top:10px"></div></div>
<div class="bottomNav"><a href="dashboard.html">🏠<br>Home</a><a href="transactions.html">💳<br>Transactions</a><a href="trade.html">📊<br>Trade</a><a href="profile.html">👤<br>Profile</a></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let user=null;
onAuthStateChanged(auth,u=>{if(!u)location.href="login.html";else user=u;});
window.submit=async()=>{
 const amt=Number(document.getElementById("amount").value);
 if(!amt||amt<10){document.getElementById("msg").textContent="Minimum $10";return;}
 document.getElementById("msg").textContent="Submitting...";
 try{
  await addDoc(collection(db,"transactions"),{uid:user.uid,type:"deposit",amount:amt,status:"pending",createdAt:serverTimestamp()});
  document.getElementById("msg").textContent="Deposit request submitted! Pending approval.";
 }catch(e){document.getElementById("msg").textContent=e.message;}
};
</script>
</body>
</html>
