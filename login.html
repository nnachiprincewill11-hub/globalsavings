
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Savings | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4ff;color:#142b49;font-family:Arial,sans-serif;padding:22px;min-height:100vh;display:grid;place-items:center}
.card{width:100%;max-width:430px;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #123b7018}
.logo{font-size:25px;font-weight:bold;color:#155eef}
p{color:#64748b}
label{display:block;font-weight:bold;font-size:13px;margin:16px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd8e8;border-radius:9px;font-size:15px}
button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}
.msg{font-size:14px;overflow-wrap:anywhere;margin-top:12px}
a{color:#155eef}
</style>
</head>
<body>
<div class="card">
  <div class="logo">▣ Global Savings</div>
  <h2>Welcome back</h2>
  <p>Login to your account.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" required
      autocomplete="current-password">

    <button id="loginBtn" type="submit">Login</button>
    <div id="message" class="msg" role="status"></div>
  </form>

  <p><a href="#" id="resetLink">Forgot password?</a></p>
  <p>Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",
  authDomain: "global-savings.firebaseapp.com",
  projectId: "global-savings",
  storageBucket: "global-savings.firebasestorage.app",
  messagingSenderId: "83435054105",
  appId: "1:83435054105:web:efac6cbd5a264a6892b688",
  measurementId: "G-XC54YQ0R7N"
};

const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginBtn").disabled = true;
  $("message").textContent = "";

  try {
    const result = await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );

    $("message").textContent =
      "Login successful. Signed in as " + result.user.email + ".";
    // Connect your private dashboard here after verifying the
    // authenticated user and enforcing Firestore security rules.
  } catch (error) {
    console.error(error);
    $("message").textContent =
      "Login failed. Check your email and password.";
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("resetLink").addEventListener("click", async event => {
  event.preventDefault();
  const email = $("email").value.trim();

  if (!email) {
    $("message").textContent =
      "Enter your email address first.";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    $("message").textContent =
      "If the account exists, a password-reset email will be sent.";
  } catch {
    $("message").textContent =
      "Unable to request a reset. Check Firebase settings.";
  }
});
</script>
</body>
</html>
