<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Savings | Login</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#142b49;font-family:Arial,sans-serif;padding:22px}
.card{max-width:420px;margin:40px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #123b7018}
.logo{font-size:26px;font-weight:bold;color:#155eef}
input{padding:12px;border:1px solid #ccd8e8;border-radius:9px;font-size:15px;width:100%;margin-top:6px}
label{font-size:13px;font-weight:bold;margin-top:14px;display:block}
button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
.msg{font-size:14px;margin-top:12px;min-height:18px}
.success{color:green}.error{color:red}
a{color:#155eef}
.blockedBox{background:#fee2e2;border:1px solid #ef4444;padding:14px;border-radius:10px;color:#7f1d1d;margin-top:12px;display:none;font-weight:bold;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">▣ Global Savings</div>
  <h2>Welcome back</h2>
  <p style="color:#64748b">Login to your account.</p>
  <form id="loginForm">
    <label>Email address<input id="email" type="email" required></label>
    <label>Password<input id="password" type="password" required></label>
    <button id="btn" type="submit">Login</button>
    <div id="message" class="msg"></div>
    <div id="blockedMsg" class="blockedBox"></div>
  </form>
  <p><a href="#" id="forgot">Forgot password?</a></p>
  <p>Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",
  authDomain: "global-savings.firebaseapp.com",
  projectId: "global-savings",
  storageBucket: "global-savings.firebasestorage.app",
  messagingSenderId: "83435054105",
  appId: "1:83435054105:web:efac6cbd5a264a6892b688"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form=document.getElementById("loginForm");
const msg=document.getElementById("message");
const btn=document.getElementById("btn");
const blockedBox=document.getElementById("blockedMsg");

async function checkUserStatus(uid){
  try{
    const snap=await getDoc(doc(db,"users",uid));
    if(!snap.exists()) return {allowed:true};
    const u=snap.data();
    const status=(u.accountStatus||"active").toLowerCase();
    if(status==="disabled"){
      const reason=u.statusReason||"Contact support +2349134538841";
      return {allowed:false, type:"disabled", reason:reason};
    }
    if(status==="paused"){
      const reason=u.statusReason||"Temporarily paused - Contact admin";
      return {allowed:false, type:"paused", reason:reason};
    }
    return {allowed:true};
  }catch(e){
    return {allowed:true};
  }
}

onAuthStateChanged(auth, async user=>{
  if(user && !form.dataset.submitting){
    const check=await checkUserStatus(user.uid);
    if(!check.allowed){
      blockedBox.style.display="block";
      blockedBox.innerHTML=`❌ ACCOUNT ${check.type.toUpperCase()}<br><span style='font-size:12px'>Reason: ${check.reason}</span><br><span style='font-size:11px'>You cannot access this account. Contact admin +2349134538841</span>`;
      msg.textContent="";
      await signOut(auth);
      return;
    }
    location.href="dashboard.html";
  }
});

form.addEventListener("submit", async e=>{
  e.preventDefault();
  form.dataset.submitting="1";
  btn.disabled=true; btn.textContent="Logging in...";
  msg.textContent=""; msg.className="msg"; blockedBox.style.display="none";
  try{
    const cred=await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
    const check=await checkUserStatus(cred.user.uid);
    if(!check.allowed){
      blockedBox.style.display="block";
      if(check.type==="disabled"){
        blockedBox.innerHTML=`❌ ACCOUNT DISABLED<br><span style='font-size:12px'>Reason: ${check.reason}</span><br><span style='font-size:11px'>Your account has been disabled by admin. You no longer have access. Contact: +2349134538841</span>`;
      }else{
        blockedBox.innerHTML=`⏸ ACCOUNT PAUSED<br><span style='font-size:12px'>Reason: ${check.reason}</span><br><span style='font-size:11px'>Your account is temporarily paused. Contact admin to enable.</span>`;
      }
      msg.textContent="";
      await signOut(auth);
      btn.disabled=false; btn.textContent="Login";
      form.dataset.submitting="";
      return;
    }
    msg.textContent=`Login successful. Signed in as ${cred.user.email}. Redirecting...`;
    msg.className="msg success";
    setTimeout(()=>{ location.href="dashboard.html"; }, 800);
  }catch(err){
    msg.textContent=err.code==="auth/invalid-credential"?"Wrong email or password":err.message;
    msg.className="msg error";
    btn.disabled=false; btn.textContent="Login";
    form.dataset.submitting="";
  }
});

document.getElementById("forgot").addEventListener("click", async ev=>{
  ev.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!email){msg.textContent="Enter your email first";return;}
  try{await sendPasswordResetEmail(auth,email);msg.textContent="Reset email sent!";msg.className="msg success";}
  catch(err){msg.textContent=err.message;msg.className="msg error";}
});
</script>
</body>
</html>
