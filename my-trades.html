<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Trades | Global Savings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial;padding-bottom:80px}
.top{background:#132a48;color:white;padding:14px;display:flex;justify-content:space-between;font-weight:bold}
.card{background:white;margin:10px;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}
.row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.active{background:#dcfce7;color:#166534}.won{background:#dbeafe;color:#1e40af}.lost{background:#fee2e2;color:#991b1b}
.btn{width:100%;padding:12px;background:#155eef;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn2{background:white;color:#132a48;border:1px solid #132a48}
</style>
</head>
<body>
<div class="top"><b onclick="location.href='dashboard.html'">← Home</b><span>My Trades</span><b onclick="location.reload()">↻</b></div>
<div id="list">Loading your trades...</div>
<div style="padding:12px"><button onclick="location.href='trade.html'" class="btn btn2">+ New Trade</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
onAuthStateChanged(auth, async u=>{
 if(!u){location.href="login.html";return;}
 const q=query(collection(db,"trades"), where("uid","==",u.uid), orderBy("createdAt","desc"));
 const snap=await getDocs(q);
 const box=document.getElementById("list");
 if(snap.empty){box.innerHTML='<div class="card">No trades yet.</div>';return;}
 box.innerHTML="";
 snap.forEach(d=>{
  const t=d.data(); const status=t.status||"active";
  box.innerHTML+=`<div class="card"><div class="row"><b>${t.coin}USD - ${t.type?.toUpperCase()} $${t.amount}</b><span class="badge ${status}">${status.toUpperCase()}</span></div><div class="row"><span>Entry: $${t.entryPrice}</span><span>Duration: ${t.duration}s</span></div><div class="row"><span>TP: $${t.takeProfitAmount}</span><span>SL: $${t.stopLossAmount}</span></div><div class="row"><span>Verdict:</span><b>${t.finalVerdict||"Pending..."}</b></div>${status==='active'?`<button class="btn" onclick="location.href='trade-view.html?id=${d.id}'">👁️ Trade View - Check Live Trade</button>`:`<button class="btn btn2" onclick="location.href='trade-view.html?id=${d.id}'">View Result</button>`}</div>`;
 });
});
</script>
</body>
</html>
