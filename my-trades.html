<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Trades</title><style>body{margin:0;background:#0a1220;color:white;font-family:Arial;padding-bottom:90px}.header{padding:16px;background:#132a48;display:flex;justify-content:space-between}.card{margin:16px;background:#132a48;border-radius:16px;padding:16px}.item{padding:12px;border:1px solid #1e355a;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;cursor:pointer;background:#0f1e38}.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#132a48;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1e355a}.bottomNav a{text-decoration:none;color:#8aa0c2;font-size:11px;text-align:center;display:flex;flex-direction:column}.bottomNav a.active{color:white}</style></head><body>
<div class="header"><b onclick="history.back()">← Back</b><b>My Trades - Tap for Full Details</b><span onclick="location.href='trade.html'">+ New</span></div><div class="card"><h3>All My Trades (REAL)</h3><div id="list">Loading...</div></div>
<div class="bottomNav"><a href="dashboard.html">🏠<br>Home</a><a href="transactions.html">💳<br>Transactions</a><a href="trade.html" class="active">📊<br>Trade</a><a href="profile.html">👤<br>Profile</a></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
onAuthStateChanged(auth, async u=>{if(!u)location.href="login.html";const q=query(collection(db,"trades"), where("uid","==",u.uid), orderBy("createdAt","desc"));const s=await getDocs(q);const box=document.getElementById("list");if(s.empty)box.innerHTML="No trades yet";else{box.innerHTML="";s.forEach(d=>{const v=d.data();box.innerHTML+=`<div class='item' onclick="location.href='trade-view.html?id=${d.id}'"><div><b>${v.coin} ${v.type?.toUpperCase()}</b><div style='font-size:11px;color:#8aa0c2'>$${v.amount} • ${v.status} • Tap for full details</div></div><b style='color:${v.status==="active"?"#22c55e":"#f59e0b"}'>${v.status==="active"?"LIVE":v.finalVerdict||v.status}</b></div>`})}});
</script></body></html>
