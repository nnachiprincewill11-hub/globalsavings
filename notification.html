<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications</title><style>body{margin:0;background:#eef4ff;font-family:Arial;padding-bottom:90px}.header{padding:16px;background:white;display:flex;justify-content:space-between}.card{margin:16px;background:white;border-radius:18px;padding:16px}.notif{padding:12px;border:1px solid #e5eefb;border-radius:10px;margin-top:10px;cursor:pointer}.bottomNav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #e2e8f0}.bottomNav a{text-decoration:none;color:#64748b;font-size:11px;text-align:center;display:flex;flex-direction:column}.bottomNav a.active{color:#155eef}#detailModal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}#detailModal.show{display:flex}.dBox{background:white;border-radius:16px;padding:20px;width:100%;max-width:380px}</style></head><body>
<div class="header"><b onclick="history.back()">← Back</b><b>Notifications - Tap for Full Details</b><span></span></div><div class="card" id="box">Loading...</div>
<div class="bottomNav"><a href="dashboard.html">🏠<br>Home</a><a href="transactions.html">💳<br>Transactions</a><a href="trade.html">📊<br>Trade</a><a href="profile.html">👤<br>Profile</a></div>
<div id="detailModal" onclick="this.classList.remove('show')"><div class="dBox" onclick="event.stopPropagation()"><h3>Full Details</h3><div id="detail"></div><button onclick="document.getElementById('detailModal').classList.remove('show')" style="width:100%;margin-top:12px;padding:12px;background:#132a48;color:white;border:0;border-radius:10px">Close</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);let all=[];
window.showN=(i)=>{const v=all[i];document.getElementById("detail").innerHTML=`<b>${v.type||"Update"}</b><br><br>${v.message||"$"+v.amount} - ${v.status}<br><br>${v.createdAt?.toDate?.()?.toLocaleString()||""}`;document.getElementById("detailModal").classList.add("show");};
onAuthStateChanged(auth, async u=>{if(!u)location.href="login.html";const q=query(collection(db,"transactions"), where("uid","==",u.uid));const s=await getDocs(q);const box=document.getElementById("box");if(s.empty)box.innerHTML="🔕 No notifications";else{box.innerHTML="";s.forEach(d=>{all.push(d.data())});all.forEach((v,i)=>{box.innerHTML+=`<div class='notif' onclick='showN(${i})'><b>${v.type}</b><br><span style='font-size:12px;color:#64748b'>${(v.message||"$"+v.amount).substring(0,60)} - Tap for full</span></div>`})}});
</script></body></html>
