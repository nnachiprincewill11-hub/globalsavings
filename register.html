<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Savings | Register</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#142b49;font-family:Arial,sans-serif;padding:22px}
.card{max-width:580px;margin:20px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #123b7018}
.logo{font-size:26px;font-weight:bold;color:#155eef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}label{font-size:13px;font-weight:bold}
input,select{padding:12px;border:1px solid #ccd8e8;border-radius:9px;font-size:15px;width:100%}
button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
.msg{font-size:14px;margin-top:12px;color:red}
#popup{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99}
#popup.show{display:flex}
.popBox{background:white;padding:26px;border-radius:16px;max-width:360px;text-align:center}
.popBox h3{color:green}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">▣ Global Savings</div>
  <h2>Create your account</h2>
  <form id="registerForm">
    <div class="grid">
      <div class="field wide"><label>Full name</label><input id="fullName" required></div>
      <div class="field"><label>Username</label><input id="username" required minlength="3"></div>
      <div class="field"><label>NIN</label><input id="nin" required></div>
      <div class="field"><label>Date of birth</label><input id="dob" type="date" required></div>
      <div class="field"><label>Phone number</label><input id="phone" type="tel" required></div>
      <div class="field"><label>Region / Country</label><select id="country" required><option value="">Loading...</option></select></div>
      <div class="field wide"><label>Email</label><input id="email" type="email" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" required minlength="8"></div>
      <div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" required></div>
      <div class="field wide"><label>Invitation code</label><input id="invite"></div>
    </div>
    <button id="submitBtn" type="submit">Create Account</button>
    <div id="message" class="msg"></div>
  </form>
  <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

<div id="popup"><div class="popBox"><h3>✅ Account Created!</h3><p>Your account has been created successfully. Please login to continue.</p><button onclick="location.href='login.html'">Go to Login</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",
  authDomain: "global-savings.firebaseapp.com",
  projectId: "global-savings",
  storageBucket: "global-savings.firebasestorage.app",
  messagingSenderId: "83435054105",
  appId: "1:83435054105:web:efac6cbd5a264a6892b688"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

function flagEmoji(c){return c.toUpperCase().replace(/./g, ch=>String.fromCodePoint(ch.charCodeAt(0)+127397));}
async function loadCountries(){
  try{
    const r=await fetch("https://restcountries.com/v3.1/all?fields=name,cca2");
    const d=await r.json();
    const list=d.filter(x=>x.cca2).map(x=>({code:x.cca2,name:x.name.common})).sort((a,b)=>a.name.localeCompare(b.name));
    $("country").innerHTML='<option value="">Choose country</option>';
    list.forEach(c=>{let o=document.createElement("option");o.value=c.code;o.textContent=`${flagEmoji(c.code)} ${c.name}`;$("country").appendChild(o);});
  }catch{
    $("country").innerHTML='<option value="">Choose country</option><option value="NG">🇳🇬 Nigeria</option><option value="GH">🇬🇭 Ghana</option><option value="US">🇺🇸 USA</option><option value="GB">🇬🇧 UK</option>';
  }
}
loadCountries();

$("registerForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const val=id=>$(id).value.trim();
  if($("password").value !== $("confirmPassword").value){$("message").textContent="Passwords do not match";return;}
  $("submitBtn").disabled=true;$("submitBtn").textContent="Creating...";
  try{
    const cred=await createUserWithEmailAndPassword(auth,val("email"),$("password").value);
    await updateProfile(cred.user,{displayName:val("fullName")});
    await setDoc(doc(db,"users",cred.user.uid),{
      uid:cred.user.uid,fullName:val("fullName"),username:val("username"),nin:val("nin"),dateOfBirth:val("dob"),
      phoneNumber:val("phone"),countryCode:val("country"),email:val("email"),invitationCode:val("invite"),
      createdAt:serverTimestamp(),balance:0,referralCount:0,accountStatus:"pending"
    });
    document.getElementById("popup").classList.add("show");
  }catch(err){
    $("message").textContent=err.code==="auth/email-already-in-use"?"Email already registered":err.message;
  }finally{$("submitBtn").disabled=false;$("submitBtn").textContent="Create Account";}
});
</script>
</body>
</html>
