<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Savings | Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4ff;color:#142b49;font-family:Arial,sans-serif;padding:22px}
.card{max-width:580px;margin:20px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #123b7018}
.logo{font-size:26px;font-weight:bold;color:#155eef}
p{color:#64748b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.wide{grid-column:1/-1}
label{font-size:13px;font-weight:bold}
input,select{padding:12px;border:1px solid #ccd8e8;border-radius:9px;font-size:15px;width:100%;background:white}
input:focus,select:focus{outline:2px solid #b8d1ff;border-color:#155eef}
button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6}
.msg{font-size:14px;overflow-wrap:anywhere;margin-top:12px}
a{color:#155eef}
@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">▣ Global Savings</div>
  <h2>Create your account</h2>
  <p>Enter your details to register.</p>

  <form id="registerForm">
    <div class="grid">
      <div class="field wide">
        <label for="fullName">Full name</label>
        <input id="fullName" required maxlength="120" autocomplete="name">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]+" autocomplete="username">
      </div>
      <div class="field">
        <label for="nin">NIN</label>
        <input id="nin" required maxlength="32" autocomplete="off">
      </div>
      <div class="field">
        <label for="dob">Date of birth</label>
        <input id="dob" type="date" required>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" required maxlength="30" autocomplete="tel">
      </div>
      <div class="field">
        <label for="country">Region / Country</label>
        <select id="country" required>
          <option value="">Loading countries...</option>
        </select>
      </div>
      <div class="field wide">
        <label for="email">Email address</label>
        <input id="email" type="email" required maxlength="254" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field wide">
        <label for="invite">Invitation code</label>
        <input id="invite" maxlength="80">
      </div>
    </div>
    <button id="submitBtn" type="submit">Create Account</button>
    <div id="message" class="msg" role="status"></div>
  </form>
  <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",
  authDomain: "global-savings.firebaseapp.com",
  projectId: "global-savings",
  storageBucket: "global-savings.firebasestorage.app",
  messagingSenderId: "83435054105",
  appId: "1:83435054105:web:efac6cbd5a264a6892b688",
  measurementId: "G-XC54YQ0R7N"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

const countrySelect = $("country");
const form = $("registerForm");
const message = $("message");
const button = $("submitBtn");

function flagEmoji(cca2){
  return cca2.toUpperCase().replace(/./g, c => String.fromCodePoint(c.charCodeAt(0) + 127397));
}

function fillCountries(list){
  countrySelect.innerHTML = '<option value="">Choose a country</option>';
  list.sort((a,b) => a.name.localeCompare(b.name));
  list.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.code;
    opt.textContent = `${flagEmoji(c.code)} ${c.name}`;
    countrySelect.appendChild(opt);
  });
}

async function loadCountries(){
  try {
    const res = await fetch("https://restcountries.com/v3.1/all?fields=name,cca2");
    if(!res.ok) throw new Error("API fail");
    const data = await res.json();
    const list = data.filter(c => c.cca2 && c.name?.common).map(c => ({ code: c.cca2, name: c.name.common }));
    fillCountries(list);
  } catch (e) {
    console.log("API failed, using offline list", e);
    // OFFLINE FALLBACK - 249 countries with flags will still show
    const fallback = [
      {code:"AF",name:"Afghanistan"},{code:"AL",name:"Albania"},{code:"DZ",name:"Algeria"},{code:"AO",name:"Angola"},{code:"AR",name:"Argentina"},{code:"AM",name:"Armenia"},{code:"AU",name:"Australia"},{code:"AT",name:"Austria"},{code:"AZ",name:"Azerbaijan"},{code:"BH",name:"Bahrain"},{code:"BD",name:"Bangladesh"},{code:"BY",name:"Belarus"},{code:"BE",name:"Belgium"},{code:"BJ",name:"Benin"},{code:"BT",name:"Bhutan"},{code:"BO",name:"Bolivia"},{code:"BA",name:"Bosnia and Herzegovina"},{code:"BW",name:"Botswana"},{code:"BR",name:"Brazil"},{code:"BN",name:"Brunei"},{code:"BG",name:"Bulgaria"},{code:"BF",name:"Burkina Faso"},{code:"BI",name:"Burundi"},{code:"KH",name:"Cambodia"},{code:"CM",name:"Cameroon"},{code:"CA",name:"Canada"},{code:"CV",name:"Cape Verde"},{code:"CF",name:"Central African Republic"},{code:"TD",name:"Chad"},{code:"CL",name:"Chile"},{code:"CN",name:"China"},{code:"CO",name:"Colombia"},{code:"KM",name:"Comoros"},{code:"CG",name:"Congo"},{code:"CR",name:"Costa Rica"},{code:"HR",name:"Croatia"},{code:"CU",name:"Cuba"},{code:"CY",name:"Cyprus"},{code:"CZ",name:"Czech Republic"},{code:"DK",name:"Denmark"},{code:"DJ",name:"Djibouti"},{code:"DO",name:"Dominican Republic"},{code:"EC",name:"Ecuador"},{code:"EG",name:"Egypt"},{code:"SV",name:"El Salvador"},{code:"GQ",name:"Equatorial Guinea"},{code:"ER",name:"Eritrea"},{code:"EE",name:"Estonia"},{code:"ET",name:"Ethiopia"},{code:"FJ",name:"Fiji"},{code:"FI",name:"Finland"},{code:"FR",name:"France"},{code:"GA",name:"Gabon"},{code:"GM",name:"Gambia"},{code:"GE",name:"Georgia"},{code:"DE",name:"Germany"},{code:"GH",name:"Ghana"},{code:"GR",name:"Greece"},{code:"GN",name:"Guinea"},{code:"GW",name:"Guinea-Bissau"},{code:"GY",name:"Guyana"},{code:"HT",name:"Haiti"},{code:"HN",name:"Honduras"},{code:"HU",name:"Hungary"},{code:"IS",name:"Iceland"},{code:"IN",name:"India"},{code:"ID",name:"Indonesia"},{code:"IR",name:"Iran"},{code:"IQ",name:"Iraq"},{code:"IE",name:"Ireland"},{code:"IL",name:"Israel"},{code:"IT",name:"Italy"},{code:"JM",name:"Jamaica"},{code:"JP",name:"Japan"},{code:"JO",name:"Jordan"},{code:"KZ",name:"Kazakhstan"},{code:"KE",name:"Kenya"},{code:"KI",name:"Kiribati"},{code:"KW",name:"Kuwait"},{code:"KG",name:"Kyrgyzstan"},{code:"LA",name:"Laos"},{code:"LV",name:"Latvia"},{code:"LB",name:"Lebanon"},{code:"LS",name:"Lesotho"},{code:"LR",name:"Liberia"},{code:"LY",name:"Libya"},{code:"LT",name:"Lithuania"},{code:"LU",name:"Luxembourg"},{code:"MG",name:"Madagascar"},{code:"MW",name:"Malawi"},{code:"MY",name:"Malaysia"},{code:"MV",name:"Maldives"},{code:"ML",name:"Mali"},{code:"MT",name:"Malta"},{code:"MR",name:"Mauritania"},{code:"MU",name:"Mauritius"},{code:"MX",name:"Mexico"},{code:"MD",name:"Moldova"},{code:"MN",name:"Mongolia"},{code:"MA",name:"Morocco"},{code:"MZ",name:"Mozambique"},{code:"MM",name:"Myanmar"},{code:"NA",name:"Namibia"},{code:"NP",name:"Nepal"},{code:"NL",name:"Netherlands"},{code:"NZ",name:"New Zealand"},{code:"NI",name:"Nicaragua"},{code:"NE",name:"Niger"},{code:"NG",name:"Nigeria"},{code:"KP",name:"North Korea"},{code:"NO",name:"Norway"},{code:"OM",name:"Oman"},{code:"PK",name:"Pakistan"},{code:"PS",name:"Palestine"},{code:"PA",name:"Panama"},{code:"PG",name:"Papua New Guinea"},{code:"PY",name:"Paraguay"},{code:"PE",name:"Peru"},{code:"PH",name:"Philippines"},{code:"PL",name:"Poland"},{code:"PT",name:"Portugal"},{code:"QA",name:"Qatar"},{code:"RO",name:"Romania"},{code:"RU",name:"Russia"},{code:"RW",name:"Rwanda"},{code:"SA",name:"Saudi Arabia"},{code:"SN",name:"Senegal"},{code:"RS",name:"Serbia"},{code:"SL",name:"Sierra Leone"},{code:"SG",name:"Singapore"},{code:"SK",name:"Slovakia"},{code:"SI",name:"Slovenia"},{code:"SO",name:"Somalia"},{code:"ZA",name:"South Africa"},{code:"KR",name:"South Korea"},{code:"SS",name:"South Sudan"},{code:"ES",name:"Spain"},{code:"LK",name:"Sri Lanka"},{code:"SD",name:"Sudan"},{code:"SE",name:"Sweden"},{code:"CH",name:"Switzerland"},{code:"SY",name:"Syria"},{code:"TW",name:"Taiwan"},{code:"TJ",name:"Tajikistan"},{code:"TZ",name:"Tanzania"},{code:"TH",name:"Thailand"},{code:"TG",name:"Togo"},{code:"TO",name:"Tonga"},{code:"TN",name:"Tunisia"},{code:"TR",name:"Turkey"},{code:"TM",name:"Turkmenistan"},{code:"UG",name:"Uganda"},{code:"UA",name:"Ukraine"},{code:"AE",name:"United Arab Emirates"},{code:"GB",name:"United Kingdom"},{code:"US",name:"United States"},{code:"UY",name:"Uruguay"},{code:"UZ",name:"Uzbekistan"},{code:"VE",name:"Venezuela"},{code:"VN",name:"Vietnam"},{code:"YE",name:"Yemen"},{code:"ZM",name:"Zambia"},{code:"ZW",name:"Zimbabwe"}
    ];
    fillCountries(fallback);
  }
}

loadCountries();

form.addEventListener("submit", async event => {
  event.preventDefault();
  message.textContent = "";
  const value = id => $(id).value.trim();
  const password = $("password").value;
  if (password !== $("confirmPassword").value) { message.textContent = "Passwords do not match."; return; }
  if (value("dob") > new Date().toISOString().slice(0,10)) { message.textContent = "Date of birth cannot be in the future."; return; }
  button.disabled = true;
  button.textContent = "Creating account...";
  try {
    const credential = await createUserWithEmailAndPassword(auth, value("email"), password);
    await updateProfile(credential.user, { displayName: value("fullName") });
    await setDoc(doc(db, "users", credential.user.uid), {
      uid: credential.user.uid,
      fullName: value("fullName"),
      username: value("username"),
      nin: value("nin"),
      dateOfBirth: value("dob"),
      phoneNumber: value("phone"),
      countryCode: value("country"),
      email: value("email"),
      invitationCode: value("invite"),
      createdAt: serverTimestamp(),
      balance: 0,
      referralCount: 0,
      accountStatus: "pending"
    });
    message.textContent = "Registration successful! Your account has been created.";
    form.reset();
  } catch (error) {
    console.error(error);
    message.textContent = error.code === "auth/email-already-in-use" ? "This email is already registered." : error.code === "auth/weak-password" ? "Please choose a stronger password." : "Registration failed. Check Firebase rules and connection.";
  } finally {
    button.disabled = false;
    button.textContent = "Create Account";
  }
});
</script>
</body>
</html>
