
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Savings | Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4ff;color:#142b49;font-family:Arial,sans-serif;padding:22px}
.card{max-width:580px;margin:20px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #123b7018}
.logo{font-size:26px;font-weight:bold;color:#155eef}
p{color:#64748b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.wide{grid-column:1/-1}
label{font-size:13px;font-weight:bold}
input,select{padding:12px;border:1px solid #ccd8e8;border-radius:9px;font-size:15px;width:100%;background:white}
input:focus,select:focus{outline:2px solid #b8d1ff;border-color:#155eef}
button{width:100%;padding:14px;background:#155eef;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6}
.msg{font-size:14px;overflow-wrap:anywhere;margin-top:12px}
a{color:#155eef}
@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">▣ Global Savings</div>
  <h2>Create your account</h2>
  <p>Enter your details to register.</p>

  <form id="registerForm">
    <div class="grid">
      <div class="field wide">
        <label for="fullName">Full name</label>
        <input id="fullName" required maxlength="120" autocomplete="name">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" required minlength="3" maxlength="30"
          pattern="[A-Za-z0-9_.-]+" autocomplete="username">
      </div>

      <div class="field">
        <label for="nin">NIN</label>
        <input id="nin" required maxlength="32" autocomplete="off">
      </div>

      <div class="field">
        <label for="dob">Date of birth</label>
        <input id="dob" type="date" required>
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" required maxlength="30"
          autocomplete="tel">
      </div>

      <div class="field">
        <label for="country">Region / Country</label>
        <select id="country" required>
          <option value="">Loading countries...</option>
        </select>
      </div>

      <div class="field wide">
        <label for="email">Email address</label>
        <input id="email" type="email" required maxlength="254"
          autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8"
          autocomplete="new-password">
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" required minlength="8"
          autocomplete="new-password">
      </div>

      <div class="field wide">
        <label for="invite">Invitation code</label>
        <input id="invite" maxlength="80">
      </div>
    </div>

    <button id="submitBtn" type="submit">Create Account</button>
    <div id="message" class="msg" role="status"></div>
  </form>

  <p>Already have an account? <a href="login.html">Login here</a></p>
  <p style="font-size:12px">Your password is securely handled by Firebase Authentication, not stored in your profile document.</p>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore, doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",
  authDomain: "global-savings.firebaseapp.com",
  projectId: "global-savings",
  storageBucket: "global-savings.firebasestorage.app",
  messagingSenderId: "83435054105",
  appId: "1:83435054105:web:efac6cbd5a264a6892b688",
  measurementId: "G-XC54YQ0R7N"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const form = $("registerForm");
const message = $("message");
const button = $("submitBtn");

// Load countries, alphabetically, with flag emojis.
try {
  const response = await fetch(
    "https://restcountries.com/v3.1/all?fields=name,cca2"
  );
  if (!response.ok) throw new Error("Country request failed");

  const countries = (await response.json())
    .filter(c => c.cca2 && c.name?.common)
    .sort((a,b) => a.name.common.localeCompare(b.name.common));

  $("country").innerHTML = '<option value="">Choose a country</option>';

  countries.forEach(c => {
    const option = document.createElement("option");
    option.value = c.cca2;
    const flag = String.fromCodePoint(
      ...[...c.cca2].map(ch => ch.charCodeAt(0) + 127397)
    );
    option.textContent = `${flag} ${c.name.common}`;
    $("country").appendChild(option);
  });
} catch {
  $("country").innerHTML =
    '<option value="">Unable to load countries. Check your internet.</option>';
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  message.textContent = "";

  const value = id => $(id).value.trim();
  const password = $("password").value;

  if (password !== $("confirmPassword").value) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (value("dob") > new Date().toISOString().slice(0,10)) {
    message.textContent = "Date of birth cannot be in the future.";
    return;
  }

  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const credential = await createUserWithEmailAndPassword(
      auth, value("email"), password
    );

    await updateProfile(credential.user, {
      displayName: value("fullName")
    });

    // Store profile details, never the password.
    await setDoc(doc(db, "users", credential.user.uid), {
      uid: credential.user.uid,
      fullName: value("fullName"),
      username: value("username"),
      nin: value("nin"),
      dateOfBirth: value("dob"),
      phoneNumber: value("phone"),
      countryCode: value("country"),
      email: value("email"),
      invitationCode: value("invite"),
      createdAt: serverTimestamp(),
      balance: 0,
      referralCount: 0,
      accountStatus: "pending"
    });

    message.textContent =
      "Registration successful! Your account has been created.";
    form.reset();

  } catch (error) {
    // If profile creation fails after Auth succeeds, the Auth
    // account may still exist; handle that case before retrying.
    console.error(error);
    message.textContent =
      error.code === "auth/email-already-in-use"
        ? "This email is already registered."
        : error.code === "auth/weak-password"
        ? "Please choose a stronger password."
        : "Registration failed. Check Firebase Authentication, Firestore rules and your connection.";
  } finally {
    button.disabled = false;
    button.textContent = "Create Account";
  }
});
</script>
</body>
</html>
