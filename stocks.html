<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Market Dashboard</title>
<link rel="stylesheet" href="stock.css">
</head>
<body>
<div class="header">
  <div class="logo">📈 Stock Market Dashboard</div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="btn btn-outline" style="padding:4px 8px">Logout</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="nav-item active" data-tab="dashboard">📊 Dashboard</div>
    <div class="nav-item" data-tab="portfolio">💼 Portfolio</div>
    <div class="nav-item" data-tab="trades">🔄 Trades</div>
    <div class="nav-item" data-tab="news">📰 News</div>
    <div class="nav-item" id="adminNav" style="display:none" data-tab="admin">⚙️ Admin Panel</div>
  </div>

  <div id="content">
    <div id="tab-dashboard">
      <div class="grid">
        <div class="card"><small>Main Balance (withdrawable)</small><h2 id="mainBalance">$0.00</h2></div>
        <div class="card"><small>Stock Balance (invested)</small><h2 id="stockBalance">$0.00</h2><div id="stockGain" class="badge-green"></div></div>
        <div class="card"><small>Portfolio Value</small><h2 id="portfolioValue">$0.00</h2></div>
      </div>
      <div class="card">
        <h3>Popular Stocks - Netflix, Apple, Google etc</h3>
        <input id="stockSearch" placeholder="Search..." class="input" style="width:200px">
        <div id="stocksList"></div>
      </div>
    </div>

    <div id="tab-portfolio" style="display:none">
      <div class="card"><h3>My Holdings - Where your stocks stay + Gain</h3><div id="holdingsList"></div></div>
    </div>
    <div id="tab-trades" style="display:none">
      <div class="tabs"><div class="tab active" data-filter="open">Open Trades</div><div class="tab" data-filter="closed">Closed Trades</div></div>
      <div id="tradesList" class="card"></div>
    </div>
    <div id="tab-news" style="display:none"><div id="newsList"></div></div>
    <div id="tab-admin" style="display:none">
      <!-- Admin add stock + logo partner + sell approval + sell date -->
      <div class="card">...</div>
    </div>
  </div>
</div>

<div id="buyModal" class="modal">...</div>
<script type="module" src="stock.js"></script>
</body>
</html>
