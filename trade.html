<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trade - Global Savings</title>
<link rel="stylesheet" href="trade.css">
</head><body>
<div class="topBar">
  <div class="topLeft">
    <div class="goldIcon">▲</div>
    <select id="assetSel" class="assetSelect" onchange="changeAsset()">
      <option value="GOLD" selected>Gold</option>
      <option value="BTCUSDT">BTC</option><option value="ETHUSDT">ETH</option>
      <option value="SOLUSDT">SOL</option><option value="EURUSD">EUR/USD</option><option value="XAUUSD">XAU/USD</option>
    </select>
    <span id="priceTop" class="priceDown">4,021.610 -45.670 (-1.12%)</span>
  </div>
  <div class="priceRight" id="priceRight">4,028.000<br>4,027.000<br>4,026.000</div>
</div>
<div class="volRow"><span>Vol</span><button class="volBtn">^</button><span id="volText" style="margin-left:auto">855</span></div>

<div id="chartWrap">
  <div id="tvChart"></div>
  <div class="priceLine" id="priceLine">4,021.610 00:41</div>
  <div id="liveBox"></div>
  <div class="timeAxis"><span>15:30</span><span>15:45</span><span>16:00</span></div>
</div>

<!-- MOBILE = IMAGE 1 -->
<div class="bottomTrade mobileOnly">
  <button class="btnSell" onclick="openTrade('sell')">Sell</button>
  <span class="qty">1</span>
  <button class="btnBuy" onclick="openTrade('buy')">Buy</button>
  <button class="btnFlat">Flatten</button>
  <span class="volBadge" id="volBadge">855</span>
</div>

<!-- DESKTOP / ROTATED = IMAGE 2 -->
<div class="bottomTrade desktopOnly">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btnSell" onclick="openTrade('sell')">Sell</button>
    <span class="qty">1</span>
    <button class="btnBuy" onclick="openTrade('buy')">Buy</button>
    <button class="btnFlat">Flatten</button>
  </div>
  <span class="volBadge" style="background:#ef4444">3.06 K</span>
</div>

<div class="controlsBar mobileOnly">
  <div class="controlsLeft">
    <button class="ctrlBtn">|◀</button><button class="ctrlBtn">▷</button><button class="ctrlBtn">◁|</button>
    <button class="ctrlBtn activeCtrl">3x</button><button class="ctrlBtn activeCtrl">1m</button><button class="ctrlBtn">|▷</button>
  </div>
  <div class="controlsLeft"><button class="ctrlBtn">⚙</button><button class="ctrlBtn">X</button></div>
</div>

<div class="controlsBar desktopOnly">
  <div class="controlsLeft">
    <button class="ctrlBtn">|◀</button><button class="ctrlBtn">▷</button><button class="ctrlBtn">◁|</button>
    <button class="ctrlBtn activeCtrl">3x</button><button class="ctrlBtn activeCtrl">1m</button><button class="ctrlBtn">|▷</button>
  </div>
  <div class="controlsLeft" style="gap:18px">
    <button class="ctrlBtn">✎</button><button class="ctrlBtn">📊</button><button class="ctrlBtn">⊞</button>
    <button class="ctrlBtn">〰</button><button class="ctrlBtn">⊕</button><button class="ctrlBtn">🕒</button>
    <button class="ctrlBtn">◧</button><button class="ctrlBtn">◀◀</button><button class="ctrlBtn">⬙</button><button class="ctrlBtn">⋯</button>
  </div>
  <div class="controlsLeft"><button class="ctrlBtn">↩</button><button class="ctrlBtn">⛶</button></div>
</div>

<div class="footerSym"><span>GOLD &nbsp; 1m</span><span>USOIL / SILVER</span></div>

<div id="popup"><div class="popCard">
  <div id="popTick" class="tick" style="background:#22c55e">✓</div>
  <h3 id="popTitle">Trade Successful</h3>
  <p id="popDesc">Your trade result</p>
  <p id="popAmt">$0.00</p>
  <button onclick="closePopup()" class="btnOk">OK</button>
</div></div>

<div id="tradeModal" class="modal"><div class="modalBox">
  <h3 id="mTitle">Open Trade</h3>
  <input id="mAmount" type="number" placeholder="Amount USD">
  <div class="editGrid"><input id="mSL" type="number" placeholder="Stop Loss (200)"><input id="mTP" type="number" placeholder="Take Profit (100)"></div>
  <div class="modalBtns"><button onclick="closeTradeModal()" class="btnCancel">Cancel</button><button id="mBtn" onclick="confirmTrade()" class="btnConfirm">Confirm</button></div>
</div></div>

<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script type="module" src="trade.js"></script>
</body></html>
