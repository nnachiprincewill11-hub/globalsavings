<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade | Global Savings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1220;color:white;font-family:Arial;padding-bottom:90px}
.topBar{background:#132a48;padding:12px;display:flex;justify-content:space-between;align-items:center}
.topBar select{background:#0f2340;color:white;border:1px solid #2a4a7a;padding:8px;border-radius:10px;font-weight:bold}
.priceBox{padding:14px;background:#0f1e38} .priceBox h2{margin:0;font-size:26px}
.up{color:#22c55e}.down{color:#ef4444}
#chart{width:100%;height:200px;background:#081122;border-top:1px solid #1e355a;border-bottom:1px solid #1e355a}
.card{background:#132a48;margin:12px;border-radius:16px;padding:16px}
.label{font-size:11px;color:#8aa0c2;margin-bottom:4px;display:block}
input,select.timeSel{width:100%;padding:12px;background:#0f2340;border:1px solid #2a4a7a;border-radius:10px;color:white;font-size:14px;margin-bottom:10px}
.row{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;font-weight:bold;cursor:pointer}
.btnSell{background:#ef4444;color:white}.btnBuy{background:#22c55e;color:white}
.btnActivate{width:100%;padding:16px;background:#155eef;color:white;border:0;border-radius:12px;font-weight:bold;font-size:18px;margin-top:10px;cursor:pointer}
.balShow{background:#0a3a7a;padding:10px;border-radius:10px;text-align:center;margin-bottom:10px}
.profitBox{background:#0f2340;border:1px dashed #3b82f6;border-radius:10px;padding:10px;text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="topBar">
<b onclick="history.back()">← Back</b>
<select id="coinSelect" onchange="changeCoin()">
<option value="BTC">BTC/USD - Bitcoin</option><option value="ETH">ETH/USD</option><option value="SOL">SOL/USD</option><option value="BNB">BNB/USD</option><option value="XRP">XRP/USD</option><option value="ADA">ADA/USD</option><option value="DOGE">DOGE/USD</option><option value="AVAX">AVAX/USD</option><option value="DOT">DOT/USD</option><option value="LINK">LINK/USD</option><option value="LTC">LTC/USD</option><option value="MATIC">MATIC/USD</option><option value="TRX">TRX/USD</option><option value="SHIB">SHIB/USD</option><option value="PEPE">PEPE/USD</option><option value="TON">TON/USD</option><option value="EURUSD">EURUSD</option><option value="GBPUSD">GBPUSD</option><option value="USDCHF">USDCHF</option><option value="USDJPY">USDJPY</option>
</select><span>⭐</span>
</div>
<div class="priceBox"><h2 id="price">$61,342.80 USD</h2><span id="change" class="up">+1.87% Live</span></div>
<canvas id="chart"></canvas>
<div class="card">
<div class="balShow">Your Main Balance: <b id="mainBal">$0.00</b><br><span style="font-size:10px;color:#8aa0c2">Will be removed automatically when you activate trade</span></div>
<label class="label">Amount to Trade (USD)</label><input id="tradeAmt" type="number" placeholder="100" oninput="calcProfit()">
<div class="row"><button class="btn btnSell" onclick="doTrade('sell')">↓ Sell</button><button class="btn btnBuy" onclick="doTrade('buy')">↑ Buy</button></div>
<div class="row" style="margin-top:10px"><div style="flex:1"><label class="label">Stop Loss (Will return if fail)</label><input id="stopLoss" type="number" placeholder="20"></div><div style="flex:1"><label class="label">Take Profit (Will get if win)</label><input id="takeProfit" type="number" placeholder="180"></div></div>
<label class="label">Time / Duration</label><select id="duration" class="timeSel"><option value="30">30 Seconds</option><option value="60" selected>1 Minute</option><option value="300">5 Minutes</option><option value="900">15 Minutes</option><option value="3600">1 Hour</option><option value="86400">24 Hours</option></select>
<div class="profitBox" id="profitPreview">Enter amount to see profit preview</div>
<button class="btnActivate" onclick="activateTrade()">Activate Trade</button><div id="msg" style="font-size:12px;margin-top:8px;color:#f87171"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmRE7PK3ve9DjBGIOCcOuq_5WyfUrwM50",authDomain:"global-savings.firebaseapp.com",projectId:"global-savings",storageBucket:"global-savings.firebasestorage.app",messagingSenderId:"83435054105",appId:"1:83435054105:web:efac6cbd5a264a6892b688"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let user=null,userData=null,currentPrice=61342,currentCoin="BTC",selectedType=null;
const prices={BTC:61342,ETH:3210,BNB:612,XRP:0.62,ADA:0.45,DOGE:0.15,SOL:178,AVAX:35,DOT:7,LINK:18,LTC:85,MATIC:0.85,TRX:0.11,SHIB:0.000025,PEPE:0.000008,TON:6.5,EURUSD:1.1151,GBPUSD:1.3051,USDCHF:0.9784,USDJPY:119.71};
onAuthStateChanged(auth, async u=>{ if(!u){location.href="login.html";return;} user=u; const s=await getDoc(doc(db,"users",u.uid)); userData=s.data(); document.getElementById("mainBal").textContent="$"+Number(userData.balance||0).toFixed(2); });
window.changeCoin=()=>{ currentCoin=document.getElementById("coinSelect").value; currentPrice=prices[currentCoin]||60000; document.getElementById("price").textContent="$"+currentPrice.toLocaleString()+" USD"; drawChart(); };
window.calcProfit=()=>{ const amt=Number(document.getElementById("tradeAmt").value||0); const tp=Number(document.getElementById("takeProfit").value||0); document.getElementById("profitPreview").innerHTML=`If win you get: <b style="color:#22c55e">$${tp}</b> | Trade amount: $${amt}`; };
window.doTrade=(type)=>{ selectedType=type; const amt=Number(document.getElementById("tradeAmt").value); if(!amt){document.getElementById("msg").textContent="Enter trade amount";return;} if(amt>(userData?.balance||0)){document.getElementById("msg").textContent="Insufficient balance";return;} document.getElementById("msg").textContent="You selected "+type.toUpperCase()+" - Now click Activate Trade"; document.getElementById("msg").style.color="#22c55e"; };
window.activateTrade=async()=>{
 const amt=Number(document.getElementById("tradeAmt").value); const tp=Number(document.getElementById("takeProfit").value); const sl=Number(document.getElementById("stopLoss").value); const dur=document.getElementById("duration").value;
 if(!amt||!tp||!sl||!selectedType){document.getElementById("msg").textContent="Fill all and choose Buy/Sell";document.getElementById("msg").style.color="#f87171";return;}
 if(amt>(userData?.balance||0)){document.getElementById("msg").textContent="Insufficient balance";return;}
 document.getElementById("msg").textContent="Activating...";
 try{
  const tradeDoc=await addDoc(collection(db,"trades"),{uid:user.uid,coin:currentCoin,type:selectedType,amount:amt,entryPrice:currentPrice,takeProfitAmount:tp,stopLossAmount:sl,duration:Number(dur),status:"active",finalVerdict:"",createdAt:serverTimestamp()});
  const newBal=Number(userData.balance)-amt;
  await updateDoc(doc(db,"users",user.uid),{balance:newBal});
  await addDoc(collection(db,"transactions"),{uid:user.uid,type:"trade_active",amount:-amt,coin:currentCoin,description:`${selectedType.toUpperCase()} ${currentCoin} trade activated - Amount deducted`,status:"completed",createdAt:serverTimestamp()});
  location.href=`trade-live.html?id=${tradeDoc.id}`;
 }catch(e){document.getElementById("msg").textContent=e.message;}
};
function drawChart(){ const c=document.getElementById("chart"); const ctx=c.getContext("2d"); c.width=c.clientWidth; c.height=200; ctx.clearRect(0,0,c.width,c.height); let x=10,base=100; for(let i=0;i<35;i++){ const green=Math.random()>0.4; const h=20+Math.random()*50; const y=base+(Math.random()*40-20); ctx.fillStyle=green?"#22c55e":"#ef4444"; ctx.fillRect(x,y,6,h); x+=14; base+=Math.random()*10-5; } }
drawChart(); setInterval(()=>{ currentPrice+=(Math.random()*10-5); document.getElementById("price").textContent="$"+currentPrice.toFixed(2)+" USD"; },3000);
</script>
</body>
</html>
